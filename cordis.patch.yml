# dsh-session-sync bundle patch.
#
# role: auto resolves at startup:
#   - $DSH_HOME/dsh-sync/hub.json    -> start the hub
#   - $DSH_HOME/dsh-sync/client.json -> sync as a paired client
#   - neither                        -> inert
# One-time setup inside DSH:
#   /session-sync init-hub                  (server; starts the hub, returns a code)
#   /session-sync pair <url> <code> <name>  (each client; writes client.json)
- insert:
    - id: session-sync
      name: '@yamsengyi/dsh-session-sync'
      config:
        role: auto
        hubUrl: ''
        token: ''
        dataDir: ''
        hubHost: 127.0.0.1
        hubPort: 8787
        hubTokens: []
        autoPush: true
        autoCheckpoint: true
        checkpointIntervalMs: 30000
        defaultWorkspace: ''
        deviceName: ''
